<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Loaf Tower</title>
  <meta name="description" content="Three cozy cat games in one notebook: stack the cats, connect them with yarn, merge them into bigger cats. Free, in your browser. By Paloma Liz.">
  <meta name="theme-color" content="#fbf6ea">
  <meta property="og:title" content="Loaf Tower">
  <meta property="og:description" content="Stack, connect and merge hand-drawn cats. 3 free games, 29 cats to collect.">
  <meta property="og:image" content="https://palomaliz.com.br/loaf_tower/cover.png">
  <meta property="og:url" content="https://palomaliz.com.br/loaf_tower/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Loaf Tower game"></canvas>

    <!-- <i data-icon="name"> placeholders are replaced by hand-drawn icons (js/icons.js) at start-up -->
    <div id="title" class="screen">
      <h1 class="logo">Loaf<br>Tower</h1>
      <p class="tag" data-i18n="tagline"></p>
      <button id="btn-play" class="btn big mode-btn"><span class="mode-name"><i data-icon="cat"></i> <span data-i18n="modeTower"></span></span><span class="mode-sub" id="sub-tower"></span></button>
      <button id="btn-yarn" class="btn mode-btn yarn"><span class="mode-name"><i data-icon="yarn"></i> <span data-i18n="modeYarn"></span></span><span class="mode-sub" id="sub-yarn"></span></button>
      <button id="btn-merge" class="btn mode-btn merge"><span class="mode-name"><i data-icon="box"></i> <span data-i18n="modeMerge"></span></span><span class="mode-sub" id="sub-merge"></span></button>
      <div class="row small">
        <button id="btn-dex" class="btn"><span data-i18n="catdex"></span> <span id="dex-count"></span></button>
        <button id="btn-sound" class="btn icon" aria-label="Audio"><i data-icon="speaker" class="sound-ico"></i></button>
      </div>
      <a class="credit" href="/">palomaliz.com.br</a>
    </div>

    <div id="hint" class="hint hidden"></div>

    <button id="btn-home" class="btn icon corner2 hidden" aria-label="Menu"><i data-icon="home"></i></button>
    <button id="btn-pause-sound" class="btn icon corner hidden" aria-label="Audio"><i data-icon="speaker" class="sound-ico"></i></button>

    <div id="over" class="screen hidden">
      <div class="card">
        <h2 id="over-title"></h2>
        <p id="over-tower" class="big-text"></p>
        <p id="over-culprit" class="culprit"></p>
        <p id="over-height" class="muted"></p>
        <button id="btn-clip" class="btn yellow"><i data-icon="clip"></i> <span data-i18n="clip"></span></button>
        <div class="row">
          <button id="btn-again" class="btn"></button>
          <button id="btn-share" class="btn" data-i18n="share"></button>
        </div>
        <div class="row">
          <button id="btn-menu" class="btn small-btn" data-i18n="menu"></button>
          <button id="btn-over-dex" class="btn small-btn"><span data-i18n="catdex"></span> <span class="dex-count2"></span></button>
        </div>
      </div>
    </div>

    <div id="dex" class="screen hidden">
      <div class="card wide">
        <h2 data-i18n="catdex"></h2>
        <div id="dex-grid"></div>
        <button id="btn-dex-close" class="btn" data-i18n="close"></button>
      </div>
    </div>

    <div id="audio" class="screen hidden">
      <div class="card">
        <h2 data-i18n="audio"></h2>
        <button id="btn-music-toggle" class="btn toggle-row">
          <i data-icon="music" class="t-ico"></i><span class="t-label" data-i18n="music"></span><span class="t-state"></span>
        </button>
        <button id="btn-sfx-toggle" class="btn toggle-row">
          <i data-icon="sfx" class="t-ico"></i><span class="t-label" data-i18n="sfx"></span><span class="t-state"></span>
        </button>
        <button id="btn-audio-close" class="btn" data-i18n="close"></button>
      </div>
    </div>

    <div id="clip" class="screen hidden">
      <div class="card">
        <p id="clip-status" class="big-text"></p>
        <div class="progress"><div id="clip-bar"></div></div>
        <video id="clip-video" class="hidden" playsinline loop muted controls></video>
        <div class="row">
          <button id="btn-clip-share" class="btn hidden" data-i18n="shareClip"></button>
          <a id="btn-clip-dl" class="btn hidden" data-i18n="download"></a>
        </div>
        <button id="btn-clip-close" class="btn small-btn" data-i18n="close"></button>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="lib/matter.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/doodle.js"></script>
  <script src="js/cats.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/clip.js"></script>
  <script src="js/yarn.js"></script>
  <script src="js/merge.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
